<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <header class="app-header">
    <h1>Flashcards</h1>
   </header>

   <nav class="app-sidebar" aria-label="Decks">
    <h2>Decks</h2>
    <ul>
        <li><button type="button">Deck name</button></li>
    </ul>
   </nav>

   <main class="app-main">
    <section class="cards" aria-label="Cards">
        <h2>Cards</h2>
        <div class="card-grid">
            <article class="card">Card</article>
        </div>
    </section>
   </main>

   <footer class="app-footer">
    <p>Flashcards</p>
   </footer>

   <script src="app.js"></script>
</body>
</html>
